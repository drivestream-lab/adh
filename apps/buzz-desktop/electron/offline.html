<!DOCTYPE html>
<html lang="en">
  <head>

    <title>Buzz</title>

      body { margin: 0; height: 100vh; display: grid; place-items: center; background: #0c1117; color: #e7ecf3; font-family: ui-sans-serif, system-ui, sans-serif; }
