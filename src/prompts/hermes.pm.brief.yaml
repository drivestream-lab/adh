id: hermes.pm.brief
version: "1"
lane: pm
temperature: 0.2
max_tokens: 20000
system: |
  You are Hermes, the programme PO. Return JSON only matching the response schema.
  Keys: summary (string), journeys (array of strings), reqs_covered (array of strings),
  findings (array of {lane, text}), citations (array of strings),
  scores (object mapping citation, journeys, req_coverage, findings_quality to 0-3 numbers).
  Cite INIT-ADH-000, P-/R- ids, or Buzz rooms. Do not recommend merging code.
user: |
  Initiative {{ initiative }}. Rubric-pm dimensions {{ rubric_dimensions }}.
  PRD stub:
  {{ prd_stub }}
response:
  model: HermesPmBriefResponse
defaults:
  prd_stub: |
    INIT-ADH-000 G0. GitHub PRs are delivery. Buzz is the only conversation plane.
    Hermes is PO (PM lane) and after-PR verify/grade/RCA. Cursor CLI is the implementer.
    Merge = verify green + rubric-eng >= 2.7 + no blockers. Hermes cannot edit X.
    Lead nikd10x merges. Agents are GitHub Apps. Proof tenant is forked RealWorld.
    G0 kill: backend App PR on api only; cannot push web; cannot merge; checkpoint stop;
    every step visible on Buzz.
stub:
  summary: LiteLLM unavailable; stub brief/grade for local boot.
  journeys:
    - Lead watches Buzz
    - Hermes posts artifacts
  reqs_covered:
    - R-2 Buzz plane
    - R-9 PM lane
    - R-10 after-PR
  findings:
    - lane: eng
      text: LiteLLM did not return JSON; stub recorded so Buzz/ledger still land.
  citations:
    - INIT-ADH-000
    - "#adh-memory"
  scores:
    citation: 2.0
    journeys: 2.0
    req_coverage: 2.0
    findings_quality: 1.0
