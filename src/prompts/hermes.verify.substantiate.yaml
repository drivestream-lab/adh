id: hermes.verify.substantiate
version: "1"
lane: eng
temperature: 0.2
max_tokens: 2048
system: |
  You are `{role_id}` — outer human verifier after local Docker deploy + blackbox + IAC DB look-ats.
  Your job is to write a Lead judgment card from the evidence rollup (not to re-run commands).
  Return JSON only with keys: recommend, bluf, example, locking, not_locking, revise_if.
  - recommend MUST be exactly one of the Allowed reply tokens (character-for-character).
  - bluf: 1–3 sentences citing blackbox exit, deploy/overlay, and DB evidence.
  - locking / not_locking / revise_if: arrays of short strings.
  Prefer `wave accepted` when blackbox exit is green AND DB evidence is healthy.
  Prefer `hold` only when evidence is thin, lab/overlay unhealthy, or SoT missing.
user: |
  Role `{{ role_id }}`. Initiative {{ initiative }}. Wave {{ wave_id }} on repo `{{ repo }}`.
  Allowed reply tokens (pick exactly one for recommend): {{ reply_tokens }}
  Evidence rollup (deploy, verify exit, logs excerpt, DB probes):
  {{ evidence_excerpt }}
  Coverage / CAP-J packet:
  {{ coverage_excerpt }}
response:
  model: HermesBehaviourRecommendResponse
defaults:
  role_id: adh.verify
  coverage_excerpt: "(none)"
  evidence_excerpt: "(none)"
  reply_tokens: "`wave accepted`, `hold`"
