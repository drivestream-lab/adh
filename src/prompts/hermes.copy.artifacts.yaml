kind: copy-catalog
id: hermes.copy.artifacts
version: "1"
templates:
  hermes.pm.hop.think:
    body: |
      Think {{ label }}  {{ initiative }}
      path: {{ path }}
      model={{ model }}  ·  not scored  ·  Hermes will not merge

      ## Job
      {{ job }}

      ## Why now
      {{ why_now }}

      ## If we do nothing
      {{ if_we_do_nothing }}

      ## Kill assumption
      {{ kill_assumption }}

      ## Locked decisions
      {{ locked_decisions }}

      ## In scope
      {{ in_scope }}

      ## Non-goals
      {{ non_goals }}

      ## Capabilities
      {{ capabilities }}

      ## Requirements
      {{ requirements }}

      ## Journeys
      {{ journeys }}

      ## Open questions
      {{ open_questions }}

      ## Whole-product delta
      {{ whole_product_delta }}

      ## Equivalent-product notes
      {{ equivalent_product_notes }}

      ## Summary
      {{ summary }}

      This is the logical output of /prd-think {{ label }}. I will not promote, open a GitHub PR, or merge.
  hermes.pm.file.think:
    body: |
      # {{ initiative }}: {{ short }} (prd-think candidate)

      | Field | Value |
      |-------|-------|
      | Initiative | {{ initiative }} |
      | Status | candidate {{ label }} |
      | Brief | conversation |
      | Existing PRD | none — not modified |
      | Candidate path | `{{ path }}` |
      | Score | `/prd-quality` — not written by this skill |

      ## 1. Job and outcome

      - **Job:** {{ job }}
      - **Why now:** {{ why_now }}
      - **If we do nothing:** {{ if_we_do_nothing }}
      - **Kill assumption:** {{ kill_assumption }}

      ## 2. Locked decisions

      {{ locked_decisions }}

      ## 3. In scope / non-goals

      ### In scope

      {{ in_scope }}

      ### Non-goals (load-bearing)

      {{ non_goals }}

      ## 5. Capabilities

      {{ capabilities }}

      ## 6. Requirements

      {{ requirements }}

      ## 10. Journeys

      {{ journeys }}

      ## 11. Open questions

      {{ open_questions }}

      ## Whole-product delta

      {{ whole_product_delta }}

      ## Equivalent-product notes

      {{ equivalent_product_notes }}

      ## Summary

      {{ summary }}
  hermes.pm.hop.quality:
    body: |
      Quality {{ initiative }} — evaluator for your judgement
      model={{ model }}  ·  X={{ threshold_x }}  ·  ready pass {{ pass_number }}/{{ max_passes }}

      {{ headline }}

      ## Our recommendation
      {{ recommendation_why }}

      {{ recommend_table }}

      ## Questions for you
      {{ questions_table }}

      Full evidence is in `{{ path }}`. Ci-wins is rank only. You name the file. I will not merge.
  hermes.pm.file.quality:
    body: |
      # {{ initiative }}-prd-quality

      ## Headline

      {{ headline }}

      ## Our recommendation

      {{ recommendation_why }}

      ## Questions for you

      {{ questions_table }}

      ## Recommendation

      {{ recommend_table }}

      ## Evidence: why {{ evidence_heading }}

      {{ evidence_block }}

      ## Scorecard

      {{ scorecard }}

      ## Notes

      {{ notes }}

      ## Harness proposal (Lead bakes in; Hermes does not edit X)

      {{ harness_proposal }}

      Engineering-ready = spec-draft without guessing. Ci-wins is rank only. You name the file to promote. Forge does not draft until you promote. I will not merge.
  hermes.pm.hop.ask:
    body: |
      Ask  {{ initiative }}
      model={{ model }}  ·  forks={{ fork_count }}  ·  Hermes will not merge
      Team rec is marked with ←. You still choose.

      {{ fork_block }}

      {{ notes }}

      Reply `F1: <choice>` lines or `skip`. This is the logical output of /prd-ask. I will not promote, open a GitHub PR, or merge.
  hermes.pm.file.ask:
    body: |
      # {{ initiative }}-prd-ask

      | Field | Value |
      |-------|-------|
      | Initiative | {{ initiative }} |
      | Candidate path | `{{ path }}` |
      | Forks | {{ fork_count }} |

      {{ fork_block }}

      {{ notes }}
  hermes.pm.hop.recommend:
    body: |
      Recommend  {{ initiative }}
      model={{ model }}  ·  pick={{ recommend }}  ·  engineering-ready={{ engineering_ready }}  ·  Hermes will not merge
      path: {{ path }}

      ## Why
      {{ why }}

      ## Why not
      {{ why_not }}

      ## Residual locks
      {{ residual_locks }}

      ## Notes
      {{ notes }}

      This is the logical output of /prd-recommend. Promote is still you. I will not merge.
  hermes.pm.file.recommend:
    body: |
      # {{ initiative }}-prd-recommend

      | Field | Value |
      |-------|-------|
      | Initiative | {{ initiative }} |
      | Recommend | {{ recommend }} |
      | Path | `{{ path }}` |
      | Engineering-ready | {{ engineering_ready }} |
      | Candidate path | `{{ file_path }}` |

      ## Why
      {{ why }}

      ## Why not
      {{ why_not }}

      ## Residual locks
      {{ residual_locks }}

      ## Notes
      {{ notes }}
  hermes.pm.hop.brief:
    body: |-
      PM brief {{ initiative }} (rubric-pm overall {{ overall }}/3, model={{ model }})

      {{ summary }}
  hermes.eng.hop.grade:
    body: |-
      ENG grade {{ pr_ref }} verify_exit={{ verify_exit }} overall={{ overall }}/3 X={{ threshold_x }} {{ merge }} (model={{ model }})

      {{ notes }}
